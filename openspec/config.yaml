schema: spec-driven

context: |
  Hacksidian — desktop-плагин Obsidian на TypeScript, Node.js и esbuild.
  Код: plugin/. Материалы: content/atlas/ и content/playground/.
  Для авторской работы материалы подключаются в отдельный vault двумя symlink.
  Поисковый каталог формируется из описаний приёмов, CSS-сведений, тем,
  переменных и стандартных настроек; поиск использует OpenAI Vector Store.
  Тесты: Vitest, npm --prefix plugin run check.
  При планировании учитывать docs/future-api-options.md: пользователь просил
  помнить Batch API и prompt caching как возможности на будущее, без внедрения сейчас.
  Требования и обсуждения пишем по-русски, технические ID — на английском.
  Договорённости, предпочтения и планы этого проекта сохраняем только в репозитории
  (OpenSpec и docs), не в памяти приложения Codex. Просьба «запомнить» в контексте
  Hacksidian означает запись в проект, а не в /Users/op/.codex/memories/.
  openspec/changes/ хранит будущие изменения; их наличие не означает реализацию.
  openspec/specs/ хранит принятые спецификации после завершения изменений.
  Не обращаться к авторскому Obsidian vault без явного разрешения пользователя.
  Для проверок использовать данные репозитория и временные vault.
  Публикация, push и платные API-проверки требуют отдельного поручения.

rules:
  proposal:
    - Указывать статус будущего изменения и явно перечислять Non-goals.
  specs:
    - Описывать наблюдаемое поведение и сценарии; не выдавать планы за текущую реализацию.
  tasks:
    - Оставлять задачи реализации незавершёнными до фактического исполнения и проверки.
