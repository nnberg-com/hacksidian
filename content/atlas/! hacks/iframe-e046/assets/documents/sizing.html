<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="responsive-embedded-sizing"><title>Демо: sizing</title><style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;background:#fffdf9;color:#322b39;font:14px/1.5 system-ui,sans-serif}header{padding:12px 18px;border-bottom:1px solid #e8e2df;display:flex;justify-content:space-between;gap:12px;font-size:12px}header b{letter-spacing:.08em}a{color:inherit}main{padding:20px}h1{font-size:clamp(22px,4vw,38px);line-height:1.1;margin:0 0 14px;letter-spacing:-.04em}h2{font-size:18px}p{max-width:60ch}.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#90515e}.map{display:block;width:100%;height:calc(100vh - 44px);min-height:190px;background:#eeeae1}.small{font-size:12px;color:#7b7277}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px}.tile{background:#f0e4de;padding:16px;border-radius:10px}.tile strong{display:block;font-size:26px}.chart{height:90px;display:flex;gap:8px;align-items:end}.chart i{flex:1;background:#a25164;border-radius:4px 4px 0 0}.poster{height:100vh;min-height:150px;display:grid;place-content:center;text-align:center;background:#efe0d6;overflow:hidden}.poster h1{font-size:clamp(32px,9vw,86px);position:relative;margin:12px}.poster p{margin:0}.sun{width:80px;height:80px;background:#bd604a;border-radius:50%;margin:auto}.poster a{font-size:12px}details{margin-top:20px}summary{cursor:pointer}input{max-width:100%;padding:8px;border:1px solid #bbb;border-radius:4px}a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #c85950;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#262330;color:#eee6df}header{border-color:#48404c}.tile{background:#42323e}.small{color:#bfb2bb}.tag{color:#eda4aa}.poster{background:#493440}}</style></head><body><main><p class="tag">Согласованный документ</p><h1>Высота по содержимому</h1><p>Эта страница разрешает передачу своего размера через meta responsive-embedded-sizing.</p><p>Без поддержки frame-sizing у окна останется резервная высота.</p></main></body></html>
