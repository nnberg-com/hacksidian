<!doctype html>
<html lang="{{language}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{i18n:title}}</title><link rel="stylesheet" href="atlas.css"><script defer src="catalog.js"></script><script defer src="atlas.js"></script></head>
<body>
<header class="masthead"><a class="brand" href="./index.html">Hacksidian<span> / {{i18n:atlas}}</span></a><span id="total"></span><button id="back" hidden>{{i18n:back}}</button></header>
<main class="workspace"><aside class="catalogue" aria-label="{{i18n:catalogue}}">
<div class="filters"><label for="search">{{i18n:find}}</label><input id="search" type="search" placeholder="{{i18n:search_placeholder}}" autocomplete="off">
<label class="sr-only" for="category">{{i18n:group}}</label><select id="category"><option value="">{{i18n:all_groups}}</option></select>
<label class="sr-only" for="digest">{{i18n:digest}}</label><select id="digest"><option value="">{{i18n:all_digests}}</option></select>
<div class="filter-row"><label class="sr-only" for="format">{{i18n:format}}</label><select id="format"><option value="">{{i18n:all_formats}}</option><option value="markdown">Markdown</option><option value="html">HTML</option><option value="properties">Properties</option></select>
<label class="sr-only" for="interactive">{{i18n:interaction}}</label><select id="interactive" title="{{i18n:interaction_hint}}"><option value="">{{i18n:all_techniques}}</option><option value="true">{{i18n:interactive_plural}}</option><option value="false">{{i18n:static_plural}}</option></select></div>
<p id="results-count" aria-live="polite"></p>
<a id="permalink" href="./index.html" target="_blank" rel="noopener">{{i18n:permalink}}</a></div>
<nav id="results" aria-label="{{i18n:results}}"></nav><p class="empty" id="empty" hidden>{{i18n:empty}}</p>
</aside><section class="reader" aria-label="{{i18n:filtered}}" tabindex="0"><div id="feed"></div><p id="feed-empty" class="empty" hidden>{{i18n:empty_feed}}</p><button id="load-more" hidden>{{i18n:load_more}}</button></section></main>
</body></html>
